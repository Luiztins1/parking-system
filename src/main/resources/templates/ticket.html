<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento - Visualizar Ticket</title>
    <style>
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .ticket-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #eaeaea;
            width: 360px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px dashed #f0f0f0;
            padding-bottom: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .info {
            text-align: left;
            margin-bottom: 20px;
        }

        .info p {
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #666;
        }

        .info p strong {
            color: #222;
            font-weight: 500;
        }

        .info p span {
            color: #333;
            font-weight: 600;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge:not(:empty) {
            background-color: #e6f4ea;
            color: #137333;
        }

        .badge[text*="CLOSED"] {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .observation-box {
            background-color: #fcfcfc;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        .barcode-container {
            margin-top: 28px;
            width: 100%;
            display: grid;
            place-items: center;
        }

        .barcode-container svg {
            display: block !important;
            margin: 0 auto !important;
            max-width: 250px;
            width: 100% !important;
            height: auto !important;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .actions button {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .actions button:hover {
            background-color: #1558b0;
        }
    </style>
</head>
<body>

<div class="ticket-card">
    <h2>TICKET DE ESTACIONAMENTO</h2>

    <div class="info">
        <p><strong>Número:</strong> <span th:text="${ticketNumber}">---</span></p>

        <p><strong>Entrada:</strong>
            <span th:text="${#temporals.format(checkInTime, 'dd/MM/yyyy HH:mm:ss')}">---</span>
        </p>

        <p th:if="${exitTime != null}">
            <strong>Saída:</strong>
            <span th:text="${#temporals.format(exitTime, 'dd/MM/yyyy HH:mm:ss')}">---</span>
        </p>

        <p><strong>Valor:</strong>
            <span th:text="${value != null} ? 'R$ ' + ${#numbers.formatDecimal(value, 1, 2, 'POINT')} : 'R$ 0,00'">---</span>
        </p>

        <p><strong>Status:</strong> <span class="badge" th:text="${status}">---</span></p>

        <div class="observation-box">
            <strong>Informações de Cobrança:</strong><br>
            Tarifa fixa de R$ 6,50 por hora. A tolerância inicial ou frações de hora inferiores a 60 minutos serão cobradas pelo valor integral da tarifa vigente (R$ 6,50).
        </div>
    </div>

    <div class="barcode-container" th:utext="${barcodeSvg}">
    </div>

    <div class="actions">
        <form th:action="@{/tickets/entrar}" method="post">
            <input type="hidden" th:value="${ticketNumber}" name="ticketNumber"/>
            <button type="submit">Gerar Ticket</button>
        </form>

        <form th:action="@{/tickets/sair}" method="post">
            <input type="hidden" th:value="${ticketNumber}" name="ticketNumber"/>
            <button type="submit">Verificar Ticket</button>
        </form>
    </div>
</div>

</body>
</html>
